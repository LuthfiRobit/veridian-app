<!doctype html>
<html lang="en">

<head>
    <title>419 Page Expired | Veridian CMS</title>
    <!-- [Meta] -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Page Expired" />
    <meta name="author" content="Veridian Dev Team" />

    <!-- [Favicon] icon -->
    <link rel="icon" href="../assets/images/favicon.svg" type="image/x-icon" />
    <!-- [Google Font] Family -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
        id="main-font-link" />
    <!-- [Tabler Icons] -->
    <link rel="stylesheet" href="../assets/fonts/tabler-icons.min.css" />
    <!-- [Template CSS Files] -->
    <link rel="stylesheet" href="../assets/css/style.css" id="main-style-link" />
    <link rel="stylesheet" href="../assets/css/style-preset.css" />
    <!-- [Error Page CSS] -->
    <link rel="stylesheet" href="../assets/css/error-costume.css" />
</head>

<body>
    <div class="error-container">
        <!-- Left Side - Error Code -->
        <div class="error-left error-bg-419">
            <i class="ti ti-clock error-icon-large error-icon-swing"></i>
            <div class="error-code-large">419</div>
        </div>

        <!-- Right Side - Message -->
        <div class="error-right">
            <h1 class="error-title">Page Expired</h1>
            <p class="error-subtitle">
                Your session has expired or the CSRF token is invalid.
                Please refresh the page and try again.
            </p>
            <div class="btn-group-custom">
                <a href="javascript:window.location.reload();" class="btn-primary-custom btn-419-primary">
                    <i class="ti ti-refresh"></i>
                    <span>Refresh Page</span>
                </a>
                <a href="index.html" class="btn-secondary-custom btn-419-secondary">
                    <i class="ti ti-arrow-left"></i>
                    <span>Dashboard</span>
                </a>
            </div>

            <div class="error-info error-info-419">
                <div class="error-info-title">Why This Happened</div>
                <div class="error-info-text">
                    • Your session may have timed out<br>
                    • The security token has expired<br>
                    • Try refreshing the page to continue
                </div>
            </div>
        </div>
    </div>

    <!-- Required Js -->
    <script src="../assets/js/plugins/popper.min.js"></script>
    <script src="../assets/js/plugins/bootstrap.min.js"></script>
</body>

</html>
