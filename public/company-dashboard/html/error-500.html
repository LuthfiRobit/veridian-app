<!doctype html>
<html lang="en">

<head>
    <title>500 Internal Server Error | Veridian CMS</title>
    <!-- [Meta] -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Internal Server Error" />
    <meta name="author" content="Veridian Dev Team" />

    <!-- [Favicon] icon -->
    <link rel="icon" href="../assets/images/favicon.svg" type="image/x-icon" />
    <!-- [Google Font] Family -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
        id="main-font-link" />
    <!-- [Tabler Icons] -->
    <link rel="stylesheet" href="../assets/fonts/tabler-icons.min.css" />
    <!-- [Template CSS Files] -->
    <link rel="stylesheet" href="../assets/css/style.css" id="main-style-link" />

    <!-- [Error Page CSS] -->
    <link rel="stylesheet" href="../assets/css/error-costume.css" />

<body>
    <div class="error-container">
        <!-- Left Side - Error Code -->
        <div class="error-left error-bg-500">
            <i class="ti ti-alert-triangle error-icon-large error-icon-shake"></i>
            <div class="error-code-large">500</div>
        </div>

        <!-- Right Side - Message -->
        <div class="error-right">
            <h1 class="error-title">Internal Server Error</h1>
            <p class="error-subtitle">
                Something went wrong on our server.
                Our team has been notified and is working to fix the issue.
            </p>
            <a href="index.html" class="btn-primary-custom btn-500">
                <i class="ti ti-arrow-left"></i>
                <span>Back to Dashboard</span>
            </a>

            <div class="error-info error-info-500">
                <div class="error-info-title">What Happened</div>
                <div class="error-info-text">
                    • An unexpected error occurred on the server<br>
                    • Our technical team has been automatically notified<br>
                    • Please try again later or contact support
                </div>
            </div>
        </div>
    </div>

    <!-- Required Js -->
    <script src="../assets/js/plugins/popper.min.js"></script>
    <script src="../assets/js/plugins/bootstrap.min.js"></script>
